[project]
name = "lfm3-neuron-explorer"
version = "0.1.0"
description = "Interactive activation inspection and steering GUI for LiquidAI/LFM3-1.7B"
requires-python = ">=3.13,<3.14"
dependencies = [
    "torch==2.14.1+rocm7.2",
    "triton-rocm==3.8.0",
    "transformers>=5.12,<6",
    "fastapi>=0.146.0",
    "uvicorn>=0.54.0",
    "pydantic>=2",
    "numpy>=2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.8",
]

[tool.uv]
python-downloads = "automatic"

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm7.2"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-rocm" }
triton-rocm = { index = "pytorch-rocm" }

[tool.ruff]
line-length = 110
target-version = "py313"
exclude = ["backend/app/vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
